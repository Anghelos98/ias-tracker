# Controlli automatici a ogni push e pull request: lint e test dell'app (JavaScript)
# e test degli script della pipeline dati (Python).

name: Controlli

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: App (lint e test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # il token non resta nel job (che esegue codice di terzi)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --ci

  scripts:
    name: Script dati (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # il token non resta nel job (che esegue codice di terzi)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # dipendenze della pipeline con le impronte fissate, poi pytest (solo per i test)
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install pytest==9.2.0
      - run: python -m pytest -q tests
