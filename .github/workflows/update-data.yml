# Aggiorna i dati di IAS Tracker e li pubblica su GitHub Pages.
#
# Ogni lunedì scarica le segnalazioni da GBIF, le schede da ISPRA e le foto da iNaturalist
# (solo CC0 e CC BY), prepara i file per
# l'app e pubblica il sito https://anghelos98.github.io/ias-tracker/ (manifest in
# data/v1/manifest.json). L'app scarica da lì solo i file cambiati.
#
# I dati non vengono salvati nel repository: ogni esecuzione li rigenera da zero.
# Si può avviare anche a mano da GitHub: Actions > "Aggiorna dati" > Run workflow.

name: Aggiorna dati

on:
  schedule:
    - cron: "0 4 * * 1" # lunedì alle 04:00 UTC
  workflow_dispatch:
    inputs:
      forza:
        description: "Pubblica anche se i dati nuovi hanno molte meno segnalazioni dei precedenti"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4 pyshp pyproj shapely

      - name: Scarica le segnalazioni da GBIF
        # GBIF a volte risponde con errori temporanei: lo script riprende da dove si era fermato,
        # quindi si riprova fino a tre volte prima di rinunciare all'aggiornamento della settimana.
        run: |
          python sync_ias_data.py --all \
            || (echo "::warning::Download GBIF incompleto, nuovo tentativo tra 2 minuti" && sleep 120 && python sync_ias_data.py --all) \
            || (echo "::warning::Download GBIF incompleto, ultimo tentativo tra 10 minuti" && sleep 600 && python sync_ias_data.py --all)

      - name: Controlla che i dati siano plausibili
        # Ferma la pubblicazione se GBIF ha restituito molte meno segnalazioni della volta prima.
        # Per pubblicare comunque un calo reale: avvio manuale con l'opzione "forza".
        run: python scripts/check_data.py ${{ inputs.forza && '--forza' || '' }}

      - name: Scarica le schede da ISPRA
        # Se ISPRA non risponde si tengono le schede già presenti nel repository.
        run: python scripts/fetch_ispra_sheets.py || echo "::warning::Schede ISPRA non aggiornate"

      - name: Scarica la griglia ISPRA 10×10 km
        # Se ISPRA non risponde si tengono le griglie già presenti nel repository.
        run: python scripts/fetch_ispra_grids.py || echo "::warning::Griglie ISPRA non aggiornate"

      - name: Aggiorna le specie simili (citazioni ISPRA)
        # Se una frase ISPRA è cambiata la voce viene omessa e compare un avviso.
        run: python scripts/build_lookalikes.py || echo "::warning::Alcune specie simili non trovate nelle schede ISPRA"

      - name: Scarica i dati europei da EASIN
        # Se EASIN non risponde si tengono i dati già presenti nel repository.
        run: python scripts/fetch_easin.py || echo "::warning::Dati EASIN non aggiornati"

      - name: Raccogli le foto da iNaturalist
        # Se iNaturalist non risponde si tengono le foto già presenti nel repository.
        run: python scripts/fetch_species_photos.py || echo "::warning::Foto non aggiornate"

      - name: Prepara i dati per l'app
        run: python scripts/build_app_data.py

      - name: Calcola le novità della settimana
        # Confronta i dati nuovi con quelli pubblicati la volta precedente su GitHub Pages.
        # Se il sito non risponde si tengono le novità già note.
        run: python scripts/build_news.py || echo "::warning::Novità della settimana non aggiornate"

      - name: Prepara il sito
        run: python scripts/build_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
